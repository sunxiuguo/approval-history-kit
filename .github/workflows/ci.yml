name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run check
      - name: Demonstrate offline execution with a network namespace
        run: |
          NODE=$(command -v node)
          sudo unshare --net "$NODE" dist/cli.js check examples/good-denial.json --checkpoint after-tools --format json
